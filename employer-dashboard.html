<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer Dashboard - JobConnect</title>

    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="auth-bar" id="authBar"></nav>

<header>
    <img src="logo.svg" class="logo" alt="JobConnect logo">
    <h1>JobConnect</h1>
    <p>Employer Dashboard</p>
</header>

<main>

<section class="profile-form profile-wide">

    <h2 class="dashboard-title">Applications Received</h2>

    <p class="profile-intro" id="dashboardSummary">Loading applications...</p>

    <div id="applicationsList"></div>

    <div class="form-actions">
        <button type="button" onclick="goPostJob()">Post a New Job</button>
        <button type="button" class="btn-outline" onclick="location.href='index.html'">Back to Home</button>
    </div>

</section>

</main>

<footer>
    <p>© 2026 JobConnect</p>
</footer>

<script type="module" src="script.js"></script>
</html>
