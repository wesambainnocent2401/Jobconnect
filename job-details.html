<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - JobConnect</title>
    <meta name="description" content="JobConnect connects job seekers with employers and career opportunities.">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="auth-bar" id="authBar"></nav>

<header>
    <a href="index.html" class="brand"><img src="logo.svg" class="logo" alt="JobConnect logo"></a>
    <h1>JobConnect</h1>
    <p>Job Details</p>
</header>

<main>

    <section class="profile-wide">

        <div class="details-card" id="jobDetails">Loading job...</div>

        <div class="form-section" id="applicationSection">
            <h2>Apply for this Job</h2>

            <form id="applicationForm">
                <div class="form-grid">
                <div class="field full">
                    <label for="applicantName">Full Name</label>
                    <input type="text" id="applicantName" placeholder="Enter your full name" required>
                </div>
                <div class="field">
                    <label for="applicantPhone">Phone Number</label>
                    <input type="tel" id="applicantPhone" placeholder="07XX XXX XXX" required>
                </div>
                <div class="field">
                    <label for="applicantEmail">Email Address</label>
                    <input type="email" id="applicantEmail" placeholder="you@example.com" required>
                </div>
                <div class="field full">
                    <label for="applicantPhoto">Passport-size Photo</label>
                    <input type="file" id="applicantPhoto" accept="image/*" required>
                    <small class="hint">A clear photo of your face with a plain background. It is cropped to passport size automatically.</small>
                    <img id="photoPreview" class="photo-preview" alt="Your passport photo preview" hidden>
                </div>
                <div class="field">
                    <label for="applicantEducation">Highest Qualification</label>
                    <select id="applicantEducation" required>
                        <option value="">Select qualification</option>
                        <option value="Secondary School">Secondary School</option>
                        <option value="Certificate">Certificate</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Degree">Degree</option>
                        <option value="Masters">Masters</option>
                        <option value="PhD">PhD</option>
                    </select>
                </div>
                <div class="field">
                    <label for="applicantExperience">Years of Experience</label>
                    <input type="number" id="applicantExperience" placeholder="e.g. 3" required min="0">
                </div>
                <div class="field full">
                    <label for="applicantSkills">Skills</label>
                    <textarea id="applicantSkills" placeholder="List your relevant skills" required></textarea>
                    <small class="hint">Separate each skill with a comma.</small>
                </div>
                <div class="field full">
                    <label for="portfolio">Portfolio Link</label>
                    <input type="url" id="portfolio" placeholder="https://...">
                    <small class="hint">Optional.</small>
                </div>
                <div class="field full">
                    <label for="coverMessage">Why are you suitable for this job?</label>
                    <textarea id="coverMessage" placeholder="Tell the employer briefly why you are suitable..." required></textarea>
                </div>
                </div>

                <div class="form-actions">
                    <button type="submit">Submit Application</button>
                    <button type="button" class="btn-outline" onclick="location.href='index.html#jobs'">Back to Jobs</button>
                </div>
            </form>
        </div>

    </section>

</main>

<footer>
    <p>&copy; 2026 JobConnect. All rights reserved.</p>
    <p class="footer-tag">Connecting talent with opportunity.</p>
</footer>

<script type="module" src="script.js"></script>

<script>
    // If script.js has not started after 8 seconds, show a warning (it disappears if the script starts late)
    setTimeout(function () {
        if (window.__jobconnectReady) return;

        var banner = document.createElement("div");
        banner.id = "jc-banner";
        banner.textContent = "JobConnect has not started. Check your internet connection and reload. " +
            "If this stays, script.js may be missing or outdated on the website.";
        banner.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:14px 16px;" +
            "background:#7a1f1f;color:#fff;font:14px/1.4 Arial,sans-serif;text-align:center;";
        document.body.appendChild(banner);
    }, 8000);
</script>

</body>
</html>
