<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - JobConnect</title>
    <meta name="description" content="JobConnect connects job seekers with employers and career opportunities.">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body data-requires="guest">

<nav class="auth-bar" id="authBar"></nav>

<header>
    <a href="index.html" class="brand"><img src="logo.svg" class="logo" alt="JobConnect logo"></a>
    <h1>JobConnect</h1>
    <p>Create Your Account</p>
</header>

<main>

    <section class="profile-wide auth-page">
        <p class="profile-intro">Job seekers apply for work. Employers post jobs and review applicants.</p>

        <form id="registerForm">
        <div class="form-section">
            <h2>Register</h2>

            <div class="form-grid">
                <div class="field full">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName" placeholder="Enter your full name" required>
                </div>
                <div class="field">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label for="registerPhone">Phone Number</label>
                    <input type="tel" id="registerPhone" placeholder="07XX XXX XXX" required>
                </div>
                <div class="field full">
                    <label for="accountType">Account Type</label>
                    <select id="accountType" required>
                        <option value="">Select account type</option>
                        <option value="jobseeker">Job Seeker - I am looking for work</option>
                        <option value="employer">Employer - I want to hire people</option>
                    </select>
                </div>
                <div class="field">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="At least 8 characters" required minlength="8">
                </div>
                <div class="field">
                    <label for="registerConfirm">Confirm Password</label>
                    <input type="password" id="registerConfirm" placeholder="Type it again" required minlength="8">
                </div>
                <div class="field full check-row">
                    <input type="checkbox" id="showPassword">
                    <label for="showPassword">Show passwords</label>
                </div>
            </div>
        </div>

            <div class="form-actions">
                <button type="submit">Create Account</button>
                <button type="button" class="btn-outline" onclick="location.href='index.html'">Back to Home</button>
            </div>
        </form>

        <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </section>

</main>

<footer>
    <p>&copy; 2026 JobConnect. All rights reserved.</p>
    <p class="footer-tag">Connecting talent with opportunity.</p>
</footer>

<script type="module" src="script.js"></script>

<script>
    // If script.js has not started after 8 seconds, show a warning (it disappears if the script starts late)
    setTimeout(function () {
        if (window.__jobconnectReady) return;

        var banner = document.createElement("div");
        banner.id = "jc-banner";
        banner.textContent = "JobConnect has not started. Check your internet connection and reload. " +
            "If this stays, script.js may be missing or outdated on the website.";
        banner.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:14px 16px;" +
            "background:#7a1f1f;color:#fff;font:14px/1.4 Arial,sans-serif;text-align:center;";
        document.body.appendChild(banner);
    }, 8000);
</script>

</body>
</html>
